name: Build and deploy kaisho-cloud

on:
  push:
    branches:
      - production

env:
  REGISTRY: ghcr.io
  IMAGE: ridingbytes/kaisho-cloud

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_HASH=${{ github.sha }}

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /home/docker/kaisho-cloud/

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GIT_SHA
          script: |
            cd /home/docker/kaisho-cloud
            # Keep previous version for rollback
            if [ -f .deploy-sha ]; then
              cp .deploy-sha .deploy-sha.prev
            fi
            mv docker-compose.prod.yml docker-compose.yml 2>/dev/null || true
            # Pin images to this exact build
            sed -i "s|:latest|:${GIT_SHA}|g" docker-compose.yml
            echo "$GIT_SHA" > .deploy-sha
            chown -R docker:docker /home/docker/kaisho-cloud
            sudo -u docker docker compose pull
            sudo -u docker docker compose up -d
