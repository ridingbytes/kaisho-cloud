<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no" />
  <title>Kaisho</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#18181b" />
  <link rel="manifest" href="/m/manifest.json" />
  <link rel="preconnect"
        href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
  <style>
    :root {
      --bg: #fafafa; --card: #fff; --raised: #f4f4f5;
      --t1: #18181b; --t2: #3f3f46; --t3: #52525b;
      --t4: #a1a1aa; --cta: #18181b; --cta-h: #27272a;
      --border: #e4e4e7; --green: #16a34a; --red: #dc2626;
      --font: "Inter", -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font); background: var(--bg);
      color: var(--t1); min-height: 100dvh;
      display: flex; flex-direction: column;
    }
    .header {
      display: flex; align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
    }
    .header h1 {
      font-size: 15px; font-weight: 700;
      letter-spacing: 0.06em; flex: 1;
    }
    .header .user { font-size: 11px; color: var(--t4); }
    .header button {
      margin-left: 8px; font-size: 11px; color: var(--t4);
      background: none; border: none; cursor: pointer;
    }
    .main { flex: 1; overflow-y: auto; padding: 16px; }
    .auth-box {
      max-width: 340px; margin: 60px auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 32px 28px;
    }
    .auth-box h2 {
      font-size: 18px; font-weight: 700;
      margin-bottom: 20px; text-align: center;
      letter-spacing: 0.04em;
    }
    .auth-box label {
      display: block; margin-bottom: 12px;
    }
    .auth-box .lbl {
      font-size: 11px; font-weight: 600; color: var(--t3);
      text-transform: uppercase; letter-spacing: 0.04em;
      margin-bottom: 4px; display: block;
    }
    .auth-box input {
      width: 100%; padding: 8px 12px; font-size: 14px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--raised); outline: none;
    }
    .auth-box input:focus { border-color: var(--cta); }
    .btn {
      display: block; width: 100%; padding: 10px;
      background: var(--cta); color: #fff; border: none;
      border-radius: 6px; font-size: 14px;
      font-weight: 600; cursor: pointer; margin-top: 16px;
    }
    .btn:disabled { opacity: 0.5; }
    .err {
      color: var(--red); font-size: 12px;
      margin-top: 8px; text-align: center;
    }
    .link {
      text-align: center; margin-top: 14px;
      font-size: 12px; color: var(--t4);
    }
    .link a {
      color: var(--cta); text-decoration: underline;
      cursor: pointer;
    }
    .timer-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
      margin-bottom: 16px; text-align: center;
    }
    .timer-time {
      font-size: 36px; font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em; margin: 8px 0 4px;
    }
    .timer-desc {
      font-size: 13px; color: var(--t3);
      margin-bottom: 12px;
    }
    .timer-customer {
      font-size: 11px; color: var(--t4);
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .stop-btn {
      display: inline-block; padding: 10px 32px;
      background: var(--red); color: #fff; border: none;
      border-radius: 8px; font-size: 14px;
      font-weight: 600; cursor: pointer; margin-top: 12px;
    }
    .form-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 16px;
      margin-bottom: 16px;
    }
    .form-card h3 {
      font-size: 11px; font-weight: 600; color: var(--t4);
      text-transform: uppercase; letter-spacing: 0.04em;
      margin-bottom: 12px;
    }
    .field { margin-bottom: 10px; }
    .field select, .field input {
      width: 100%; padding: 8px 10px; font-size: 13px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--raised); outline: none;
      font-family: var(--font);
    }
    .field select:focus, .field input:focus {
      border-color: var(--cta);
    }
    .entry {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .entry:last-child { border-bottom: none; }
    .entry-time {
      font-size: 11px; color: var(--t4);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .entry-customer {
      font-size: 10px; color: var(--t4);
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .entry-desc { flex: 1; color: var(--t2); }
    .entry-dur {
      font-size: 12px; font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .synced-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green); flex-shrink: 0;
    }
    .unsynced-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--t4); flex-shrink: 0;
    }
    .tabs {
      display: flex; gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .tab {
      padding: 8px 14px; font-size: 12px;
      font-weight: 600; color: var(--t4);
      background: none; border: none; cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab--active {
      color: var(--cta);
      border-bottom-color: var(--cta);
    }
    .empty {
      text-align: center; padding: 32px 16px;
      color: var(--t4); font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/m/sw.js")
        .then(function (reg) {
          // Try flushing offline queue on load
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller
              .postMessage("flush-queue");
          }
        });
      navigator.serviceWorker.addEventListener(
        "message", function (event) {
          if (
            event.data &&
            event.data.type === "queue-flushed"
          ) {
            // Reload data after queue flush
            if (typeof loadData === "function") {
              loadData();
            }
          }
        }
      );
    }
  </script>
</body>
</html>
