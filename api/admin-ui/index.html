<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Kaisho admin</title>
  <style>
    :root {
      --bg: #f6f4ef; --card: #fff; --ink: #1c1a17; --muted: #6b655c;
      --line: #e4ded3; --accent: #2f6d4f; --danger: #b23b3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 15px/1.5 system-ui, sans-serif;
      background: var(--bg); color: var(--ink);
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 22px; border-bottom: 1px solid var(--line);
      background: var(--card);
    }
    header h1 { font-size: 16px; margin: 0; }
    main { max-width: 1100px; margin: 0 auto; padding: 22px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 10px; padding: 18px; margin-bottom: 18px;
    }
    label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 3px; }
    input {
      width: 100%; padding: 9px 11px; border: 1px solid var(--line);
      border-radius: 7px; font: inherit; background: #fff;
    }
    button {
      font: inherit; padding: 8px 13px; border: 1px solid var(--line);
      border-radius: 7px; background: #fff; cursor: pointer;
    }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.danger { color: var(--danger); border-color: #e6c9c9; }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
    .row > div { flex: 1; min-width: 160px; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line);
      font-size: 14px; vertical-align: middle;
    }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
    td .acts { display: flex; gap: 6px; flex-wrap: wrap; }
    td .acts button { padding: 5px 9px; font-size: 13px; }
    .pill { font-size: 12px; padding: 2px 8px; border-radius: 20px; }
    .ok { background: #e3f0e8; color: var(--accent); }
    .off { background: #f3e0e0; color: var(--danger); }
    .muted { color: var(--muted); }
    .msg { padding: 10px 12px; border-radius: 7px; margin-bottom: 12px; display: none; }
    .msg.err { background: #f7e4e4; color: var(--danger); display: block; }
    .msg.info { background: #e6efe9; color: var(--accent); display: block; }
    code { background: #efece5; padding: 2px 6px; border-radius: 5px; }
    .hidden { display: none; }
    dialog {
      border: 1px solid var(--line); border-radius: 10px; padding: 18px;
      max-width: 460px; width: 92%;
    }
    dialog::backdrop { background: rgba(0,0,0,.35); }
  </style>
</head>
<body>
  <header>
    <h1>Kaisho admin</h1>
    <div id="whoami" class="muted"></div>
  </header>
  <main>
    <div id="msg" class="msg"></div>

    <div id="login" class="card">
      <p class="muted">Enter this server's <code>ADMIN_API_KEY</code> to
        manage accounts.</p>
      <div class="row">
        <div>
          <label>Admin API key</label>
          <input id="key" type="password" autocomplete="off"
                 placeholder="ADMIN_API_KEY" />
        </div>
        <div style="flex:0 0 auto">
          <button id="connect" class="primary">Connect</button>
        </div>
      </div>
    </div>

    <div id="app" class="hidden">
      <div class="card">
        <div class="row">
          <div>
            <label>Email</label>
            <input id="newEmail" type="email" placeholder="user@example.com" />
          </div>
          <div>
            <label>Password (min 8)</label>
            <input id="newPw" type="text" placeholder="a good password" />
          </div>
          <div style="flex:0 0 auto">
            <button id="add" class="primary">Add user</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="row" style="justify-content:space-between;margin-bottom:6px">
          <strong>Accounts</strong>
          <button id="refresh">Refresh</button>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>Email</th><th>Status</th><th>Entries</th>
                <th>Tasks</th><th>Notes</th><th>Last activity</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <dialog id="tokenDlg">
    <h3 style="margin-top:0">Sync token</h3>
    <p class="muted">Give this to the desktop app (Settings &gt; Cloud
      Sync). It is shown once.</p>
    <input id="tokenVal" readonly />
    <div style="margin-top:14px;text-align:right">
      <button id="tokenClose" class="primary">Done</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
