# kaisho-cloud — self-host stack.
#
# Runs your own Kaisho sync + AI server on plain PostgreSQL,
# no Supabase. `docker compose up --build` gives you:
#   - the API + mobile PWA at http://localhost:3000  (PWA: /m)
#   - a dedicated Postgres with your data
#   - a cron worker for scheduled AI runs
#
# First run:
#   cp .env.example .env      # then set the secrets it lists
#   docker compose up --build
#
# Then open http://localhost:3000/m on your phone's browser to
# track time (see docs/self-hosting.md — a phone needs HTTPS,
# so put this behind a reverse proxy, or use the deploy/hosted
# Traefik stack, for real mobile use). Point the desktop app at
# your server URL under Settings > Cloud Sync.

services:
  db:
    image: postgres:16
    container_name: kaisho-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kaisho}
      POSTGRES_USER: ${POSTGRES_USER:-kaisho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaisho}
    volumes:
      - kaisho-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kaisho}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applies db/schema.sql then exits. api waits for it.
  migrate:
    build: .
    restart: "no"
    env_file: .env
    command: ["node", "db/migrate.js"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    container_name: kaisho-cloud
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Scheduled AI runs (optional; harmless with no cron jobs).
  # Same image, worker entrypoint.
  cron:
    build: .
    container_name: kaisho-cron
    restart: unless-stopped
    env_file: .env
    command: ["node", "api/workers/cron.js"]
    depends_on:
      - api

volumes:
  kaisho-pg-data:
