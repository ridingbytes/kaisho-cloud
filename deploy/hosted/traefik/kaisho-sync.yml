# Traefik file-provider config for the hosted stack while it
# runs alongside the legacy Supabase stack: it answers on
# https://sync.kaisho.dev, the legacy stack still owns
# cloud.kaisho.dev. At cutover this file is replaced by
# kaisho-cloud.yml next to it.
#
# Routes to the kaisho-sync container on port 3000 inside the
# traefik-public network.
#
# The authoritative copy lives in the traefik repo's conf.d/;
# this copy is the app-side record of the route, per the
# convention in traefik/CLAUDE.md. bin/deploy does NOT ship
# it — route changes go out with the traefik repo's own
# bin/deploy.

http:
  routers:
    kaisho-sync:
      rule: "Host(`sync.kaisho.dev`)"
      entrypoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: kaisho-sync
      middlewares:
        - kaisho-sync-headers

  middlewares:
    kaisho-sync-headers:
      headers:
        stsSeconds: 15552000
        stsIncludeSubdomains: true

  services:
    kaisho-sync:
      loadBalancer:
        servers:
          - url: "http://kaisho-sync:3000"
