# Traefik file-provider config for the database browser.
#
#   https://db.kaisho.dev/   pgweb, read-only
#
# The app-side record. The authoritative copy belongs in the
# traefik repo's conf.d/ and ships with that repo's
# bin/deploy; kaisho-cloud's bin/deploy does not ship routes.
#
# Two gates, and neither is optional here. pgweb has no
# authentication of its own and holds the whole database, so
# the allowlist alone would mean any VPN peer, or anything
# running on one, has every row. Basic auth is the second.

http:
  routers:
    kaisho-pgweb:
      rule: "Host(`db.kaisho.dev`)"
      entrypoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: kaisho-pgweb
      middlewares:
        - kaisho-pgweb-allowlist
        - kaisho-pgweb-auth

  middlewares:
    kaisho-pgweb-allowlist:
      ipAllowList:
        sourceRange:
          # VPN only. 172.18.0.1 is the traefik-public
          # gateway, where a VPN peer's request arrives after
          # being masqueraded twice (by wg-easy, then by the
          # host hairpinning back into the bridge). Measured,
          # not derived; external traffic keeps its real
          # address via DNAT, so this opens nothing to the
          # internet. Same reasoning as conf.d/dozzle.yml.
          - "172.18.0.1/32"

    kaisho-pgweb-auth:
      basicAuth:
        # htpasswd bcrypt hash. Replace by generating a new
        # one; the credential is not derivable from this file
        # and lives nowhere else.
        users:
          - "kaisho:$2y$05$YJzz62iSs/ztLQoA.NHVWuHaGOf/86WqEVc8ZzLHEG3FPU6FPM1EG"

  services:
    kaisho-pgweb:
      loadBalancer:
        servers:
          - url: "http://kaisho-pgweb:8081"
