# Traefik file-provider config for the hosted kaisho-cloud
# stack. Copy to /home/docker/traefik/conf.d/ — Traefik
# hot-reloads it (no restart needed).
#
# Routes https://cloud.kaisho.dev to the kaisho-cloud container
# on port 3000 inside the traefik-public network.
#
# The authoritative copy of every route lives in the traefik
# repo's conf.d/; this copy is the app-side record, per the
# convention in traefik/CLAUDE.md. bin/deploy does NOT ship
# it, so a route change is two repos in one change.

http:
  routers:
    kaisho-cloud:
      rule: "Host(`cloud.kaisho.dev`)"
      entrypoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: kaisho-cloud
      middlewares:
        - kaisho-cloud-headers

  middlewares:
    kaisho-cloud-headers:
      headers:
        stsSeconds: 15552000
        stsIncludeSubdomains: true
        stsPreload: true

  services:
    kaisho-cloud:
      loadBalancer:
        servers:
          - url: "http://kaisho-cloud:3000"
