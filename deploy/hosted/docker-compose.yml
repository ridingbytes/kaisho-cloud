# kaisho-cloud: self-contained hosted stack
#
# The managed "sync + AI" server, running kaisho-cloud against
# its OWN PostgreSQL (no Supabase). Modelled on the owncloud
# stack on the same VPS: an app plus a dedicated postgres:16 on
# a private internal network, joined to the shared external
# traefik-public network for ingress.
#
# The image is built ON THE HOST from ./src, which bin/deploy
# rsyncs out of this repo. No registry, no CI: see bin/deploy.
# All three app services share one build and one image tag, so
# api, cron and migrate can never drift apart.
#
# This file is deployed to ${REMOTE_DIR}/docker-compose.yml by
# bin/deploy. Do not edit it on the host: the next deploy
# overwrites it.
#
# Prerequisites on the VPS:
#   - docker network create traefik-public   (already exists)
#   - cp .env.example .env                    (fill secrets, chmod 600)
#   - cp traefik/kaisho-cloud.yml /home/docker/traefik/conf.d/

services:
  db:
    image: postgres:16
    container_name: kaisho-cloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - kaisho-cloud-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # One-shot schema/migration runner. Same image as the API,
  # runs db/migrate.js then exits. api waits for it to finish.
  migrate:
    build: ./src
    image: kaisho-cloud:local
    restart: "no"
    env_file: .env
    command: ["node", "db/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  api:
    build: ./src
    image: kaisho-cloud:local
    container_name: kaisho-cloud
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - traefik-public
      - internal

  # Scheduled AI runs. Same image, worker entrypoint. No
  # ingress; joins the internal network for DB access and has
  # outbound egress for the AI backend.
  cron:
    build: ./src
    image: kaisho-cloud:local
    container_name: kaisho-cron
    restart: unless-stopped
    env_file: .env
    command: ["node", "api/workers/cron.js"]
    depends_on:
      api:
        condition: service_started
    networks:
      - internal

  # Read-only database browser at db.kaisho.dev, the
  # equivalent of what Supabase Studio used to provide.
  #
  # --readonly is deliberate. A browser tab with write access
  # to the production database, reachable in one click and
  # with no undo, is a worse trade than occasionally falling
  # back to psql. Drop the flag if that changes.
  #
  # Two gates, like every other admin UI on this host: the
  # Traefik route restricts it to the VPN, and basic auth
  # sits behind that. pgweb has no auth of its own, so
  # without the second gate anyone already on the VPN would
  # have the whole database.
  pgweb:
    image: sosedoff/pgweb:0.17.0
    container_name: kaisho-pgweb
    restart: unless-stopped
    environment:
      PGWEB_DATABASE_URL: ${DATABASE_URL}
    # --ssl=disable because the connection never leaves the
    # stack's private network: pgweb defaults to requiring
    # TLS and exits with "SSL is not enabled on the server",
    # while this Postgres has no certificate and needs none.
    # Set as a flag rather than appended to DATABASE_URL, so
    # the two do not have to agree about query strings.
    command:
      - "--bind=0.0.0.0"
      - "--listen=8081"
      - "--readonly"
      - "--ssl=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - traefik-public
      - internal

networks:
  traefik-public:
    external: true
  internal:

volumes:
  kaisho-cloud-pg:
